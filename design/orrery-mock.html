<title>Agent Observatory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0B1315; --panel:#10191C; --panel2:#152225; --panel3:#1B2B2F; --line:#1F3034; --line2:#2A3E43;
  --text:#D9E4E2; --muted:#7E9295; --faint:#4E6064;
  --accent:#F0704F; --active:#38D1B0; --wait:#F2B84B; --err:#EE5D6E; --idle:#5C6E71;
  --t-read:#38D1B0; --t-grep:#5BA7F0; --t-edit:#F0704F; --t-bash:#F2B84B; --t-web:#B98CF5; --t-agent:#F0704F;
  --ty-explore:#38D1B0; --ty-plan:#5BA7F0; --ty-gp:#F0704F; --ty-review:#B98CF5;
  --glow:rgba(56,209,176,.35); --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35);
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF3F2; --panel:#FFFFFF; --panel2:#E9F0EF; --panel3:#DDE7E5; --line:#D3DDDB; --line2:#BFCDCA;
    --text:#14201F; --muted:#5B6D6F; --faint:#93A3A5;
    --accent:#D85A3A; --active:#149C82; --wait:#B37A12; --err:#C93F50; --idle:#8A9A9C;
    --t-read:#149C82; --t-grep:#2C7FD1; --t-edit:#D85A3A; --t-bash:#B37A12; --t-web:#8A5BD6; --t-agent:#D85A3A;
    --ty-explore:#149C82; --ty-plan:#2C7FD1; --ty-gp:#D85A3A; --ty-review:#8A5BD6;
    --glow:rgba(20,156,130,.25); --shadow:0 1px 2px rgba(20,32,31,.06), 0 8px 24px rgba(20,32,31,.06);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEF3F2; --panel:#FFFFFF; --panel2:#E9F0EF; --panel3:#DDE7E5; --line:#D3DDDB; --line2:#BFCDCA;
  --text:#14201F; --muted:#5B6D6F; --faint:#93A3A5;
  --accent:#D85A3A; --active:#149C82; --wait:#B37A12; --err:#C93F50; --idle:#8A9A9C;
  --t-read:#149C82; --t-grep:#2C7FD1; --t-edit:#D85A3A; --t-bash:#B37A12; --t-web:#8A5BD6; --t-agent:#D85A3A;
  --ty-explore:#149C82; --ty-plan:#2C7FD1; --ty-gp:#D85A3A; --ty-review:#8A5BD6;
  --glow:rgba(20,156,130,.25); --shadow:0 1px 2px rgba(20,32,31,.06), 0 8px 24px rgba(20,32,31,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--ui);padding-inline:16px;padding-block:12px;overflow:hidden}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;height:100%;min-height:0}

/* top bar */
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:30px;height:30px;flex:none}
.brand .mark .orbit{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.brand .name{font:600 19px/1 var(--display);letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:12px;margin-left:6px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;display:flex;flex-direction:column;min-width:108px}
.stat .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:500 18px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.stat .v.live{color:var(--active)}
.stat .v.bump{animation:bump .35s ease}
.mode{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 8px;background:var(--panel)}
.mode .dot{width:7px;height:7px;border-radius:50%;background:var(--active);box-shadow:0 0 0 3px var(--glow);animation:pulse 2s ease-in-out infinite}

/* panes */
.main{display:grid;grid-template-columns:272px minmax(0,1fr) 316px;gap:12px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ph .hint{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.ph .count{background:var(--panel3);color:var(--text);border-radius:999px;padding:0 7px;font-family:var(--mono);font-weight:500}
.center{display:grid;grid-template-rows:minmax(0,1fr) 228px;gap:12px;min-height:0}

/* sessions rail */
.sessions ul{list-style:none;margin:0;padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.sess{border:1px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;gap:6px;background:transparent;transition:background .2s,border-color .2s,transform .2s}
.sess:hover{background:var(--panel2);transform:translateX(2px)}
.sess.sel{background:var(--panel2);border-color:var(--line2)}
.sess .row{display:flex;align-items:center;gap:8px;min-width:0}
.sess .av{width:26px;height:26px;flex:none}
.sess .title{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .cwd{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .meta{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--muted);flex-wrap:wrap}
.sess .meta b{color:var(--text);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);flex:none}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--idle)}
.pill.busy{color:var(--active);border-color:color-mix(in srgb,var(--active) 40%,transparent)} .pill.busy i{background:var(--active);animation:pulse 1.4s ease-in-out infinite}
.pill.wait{color:var(--wait);border-color:color-mix(in srgb,var(--wait) 40%,transparent)} .pill.wait i{background:var(--wait);animation:pulse 1s ease-in-out infinite}
.pill.done{color:var(--muted)} .pill.done i{background:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:2px;height:16px;flex:1}
.spark span{flex:1;background:var(--faint);border-radius:1px;min-height:2px;transition:height .5s ease}
.sess.busy .spark span{background:var(--active);opacity:.75}
.sess.wait .spark span{background:var(--wait);opacity:.6}
.sess .kind{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.sess .waitmsg{color:var(--wait);display:inline-flex;align-items:center;gap:4px}
.sess .waitmsg svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;animation:wobble 1.6s ease-in-out infinite;transform-origin:50% 10%}

/* graph */
.graph{position:relative}
.graph svg{flex:1;width:100%;height:100%;min-height:0;display:block;font-family:var(--ui)}
.edge{fill:none;stroke:var(--line2);stroke-width:1.5;transition:stroke .4s,opacity .4s}
.edge.live{stroke:var(--active);stroke-dasharray:3 9;animation:dash 1.2s linear infinite;opacity:.9}
.edge.done{opacity:.35}
.particle{fill:var(--active);filter:url(#pglow)}
.particle.back{fill:var(--accent)}
.node{cursor:pointer}
.node .base{fill:var(--panel2);stroke:var(--line2);stroke-width:1.5;transition:stroke .3s}
.node:hover .base{stroke:var(--text)}
.node.sel .base{stroke:var(--text);stroke-width:2}
.node .halo{fill:var(--active);opacity:0;filter:url(#halo)}
.node.live .halo{animation:breathe 2.2s ease-in-out infinite}
.node .ring{fill:none;stroke:var(--active);stroke-width:3;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transform-box:fill-box;transition:stroke-dashoffset .25s linear}
.node.done .ring{stroke:var(--muted)}
.node .lbl{font-size:12.5px;font-weight:600;fill:var(--text);text-anchor:middle}
.node .desc{font-size:11px;fill:var(--muted);text-anchor:middle}
.node .chip{font-family:var(--mono);font-size:10.5px;fill:var(--bg);text-anchor:middle;font-weight:500;pointer-events:none}
.node .chipbg{rx:6;stroke:none;transition:width .2s,x .2s}
.node.done .chipbg{fill:var(--muted)}
.root .base{fill:var(--panel3);stroke:var(--accent);stroke-width:2}
.root .halo{fill:var(--accent)}
.node.flash .base{animation:flash .7s ease}
.node.enter{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.node.leave{animation:fade .6s ease both}
.burst{fill:none;stroke:var(--active);stroke-width:2;pointer-events:none}
/* bot character */
.bot{transform-box:fill-box;transform-origin:center}
.node.live .bot{animation:bob 1.6s ease-in-out infinite}
.bot .head{fill:var(--panel3);stroke:var(--line2);stroke-width:1.4;transition:stroke .3s}
.node.live .bot .head{stroke:var(--active)}
.root .bot .head{stroke:var(--accent)}
.bot .ant{stroke:var(--line2);stroke-width:1.6;stroke-linecap:round}
.bot .atip{fill:var(--faint);transition:fill .3s}
.node.live .bot .atip{fill:var(--active);animation:glowdot 1.1s ease-in-out infinite}
.root .bot .atip{fill:var(--accent)}
.bot .eye{fill:var(--text);transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.bot .eye.r{animation-delay:.08s}
.node.live .bot .eyes{animation:look 3s ease-in-out infinite}
.bot .happy,.bot .sleep{display:none;fill:none;stroke:var(--text);stroke-width:1.8;stroke-linecap:round}
.bot .mouth{fill:none;stroke:var(--text);stroke-width:1.6;stroke-linecap:round;transition:d .3s}
.node.done .bot .eye,.node.zz .bot .eye{display:none}
.node.done .bot .happy{display:block}
.node.zz .bot .sleep{display:block}
.node.zz .bot .head{stroke:var(--faint)}
.bot .cheek{fill:var(--accent);opacity:0;transition:opacity .3s}
.node.done .bot .cheek{opacity:.55}
.headset{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}
/* accessory (tool in hand) */
.acc{transform-box:fill-box;transform-origin:center;transition:opacity .2s}
.acc .abg{fill:currentColor;stroke:var(--panel);stroke-width:2}
.acc use{stroke:var(--bg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acc.t-grep,.acc.t-glob{animation:scan 1s ease-in-out infinite alternate}
.acc.t-edit,.acc.t-write{animation:scribble .32s ease-in-out infinite alternate}
.acc.t-bash{animation:blinkop 1s steps(2,end) infinite}
.acc.t-web{animation:spin 2.6s linear infinite}
.acc.t-read{animation:flip 1.3s ease-in-out infinite}
.acc.t-think{animation:bob .9s ease-in-out infinite}
.acc.t-agent{animation:spin 1.6s linear infinite}
.zzz{font-family:var(--mono);font-size:12px;fill:var(--muted);animation:floatz 2.4s ease-out infinite;opacity:0}
.zzz.z2{animation-delay:.8s}.zzz.z3{animation-delay:1.6s}
.qmark{font:600 16px var(--display);fill:var(--wait);animation:bob 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bell{transform-box:fill-box;transform-origin:50% 10%;animation:wobble 1.6s ease-in-out infinite}
.scene .msg{font-size:12px;fill:var(--muted);text-anchor:middle}
.scene .msgbg{fill:var(--panel2);stroke:var(--line2);rx:8}
.glegend{position:absolute;left:14px;bottom:10px;display:flex;gap:12px;font-family:var(--mono);font-size:10.5px;color:var(--muted);flex-wrap:wrap}
.glegend span{display:inline-flex;align-items:center;gap:5px}
.glegend i{width:8px;height:8px;border-radius:2px}
/* toasts */
.toasts{position:absolute;right:12px;bottom:34px;display:flex;flex-direction:column-reverse;gap:6px;pointer-events:none;max-width:min(320px,80%)}
.toast{background:var(--panel3);border:1px solid var(--line2);border-left:3px solid var(--c,var(--active));border-radius:8px;padding:6px 10px;font-size:12px;display:flex;align-items:center;gap:8px;animation:toastin .35s cubic-bezier(.2,.9,.3,1.2) both,toastout .4s ease 3.4s both;box-shadow:var(--shadow)}
.toast .ic{width:18px;height:18px;border-radius:5px;background:color-mix(in srgb,var(--c,var(--active)) 22%,transparent);display:grid;place-items:center;color:var(--c,var(--active));flex:none}
.toast .ic svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast b{font-weight:600}
.toast .m{font-family:var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* timeline */
.timeline .lanes{position:relative;flex:1;overflow:hidden;padding:6px 0 18px;min-height:0}
.lane{display:grid;grid-template-columns:132px minmax(0,1fr);align-items:center;height:26px;transition:opacity .4s}
.lane.gone{opacity:.45}
.ln{padding:0 12px;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.ln i{width:7px;height:7px;border-radius:2px;flex:none}
.track{position:relative;height:16px;border-top:1px dashed color-mix(in srgb,var(--line) 70%,transparent)}
.bar{position:absolute;top:2px;height:12px;border-radius:3px;min-width:2px;opacity:.9;cursor:default}
.bar:hover{opacity:1;outline:1px solid var(--text)}
.bar.running{box-shadow:0 0 0 2px color-mix(in srgb,currentColor 35%,transparent);animation:barpulse 1s ease-in-out infinite}
.ticks{position:absolute;left:132px;right:0;bottom:2px;height:14px;font-family:var(--mono);font-size:10px;color:var(--faint)}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.ticks span::before{content:"";position:absolute;left:50%;bottom:16px;height:1000px;border-left:1px solid var(--line);opacity:.5}
.playhead{position:absolute;right:0;top:6px;bottom:18px;width:2px;background:var(--accent);opacity:.8}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-family:var(--mono);font-size:12px}
.t-read{background:var(--t-read);color:var(--t-read)} .t-grep,.t-glob{background:var(--t-grep);color:var(--t-grep)} .t-edit,.t-write{background:var(--t-edit);color:var(--t-edit)} .t-bash{background:var(--t-bash);color:var(--t-bash)} .t-web{background:var(--t-web);color:var(--t-web)} .t-agent{background:var(--t-agent);color:var(--t-agent)} .t-think{background:var(--faint);color:var(--faint)}
svg .t-read,svg .t-grep,svg .t-glob,svg .t-edit,svg .t-write,svg .t-bash,svg .t-web,svg .t-agent,svg .t-think{background:none}

/* inspector */
.ihead{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.ihead .who{display:flex;align-items:center;gap:8px}
.ihead .type{font:600 15px/1.2 var(--display)}
.ihead .id{font-family:var(--mono);font-size:10.5px;color:var(--faint);word-break:break-all}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kv div{background:var(--panel2);border-radius:8px;padding:6px 8px}
.kv .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv .v{font:500 14px/1.3 var(--mono);font-variant-numeric:tabular-nums}
.tybadge{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:6px;color:var(--bg);font-weight:500}
.now{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.now .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.now .v{font-family:var(--mono);font-size:12px;display:flex;align-items:center;gap:8px;min-width:0}
.now .v .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--active);animation:spin .9s linear infinite;flex:none}
.feed{list-style:none;margin:0;padding:6px 8px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px}
.fi{display:grid;grid-template-columns:22px 52px minmax(0,1fr) 54px;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;animation:slidein .35s ease both}
.fi:hover{background:var(--panel2)}
.fi .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:color-mix(in srgb,currentColor 16%,transparent)}
.fi .ic svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fi.running .ic.t-grep svg,.fi.running .ic.t-glob svg{animation:scan 1s ease-in-out infinite alternate}
.fi.running .ic.t-edit svg,.fi.running .ic.t-write svg{animation:scribble .32s ease-in-out infinite alternate}
.fi.running .ic.t-bash svg{animation:blinkop 1s steps(2,end) infinite}
.fi.running .ic.t-web svg{animation:spin 2.6s linear infinite}
.fi.running .ic.t-read svg{animation:flip 1.3s ease-in-out infinite}
.fi.running .ic.t-think svg{animation:bob .9s ease-in-out infinite}
.fi .tn{font-weight:600;font-size:12px;color:var(--text)}
.fi .ta{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .td{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.fi.running .td{color:var(--active)}
.fi.agent .tn{color:var(--accent)}
.thought{grid-column:1/-1;font-size:12px;color:var(--muted);padding:2px 4px 4px 30px;font-style:italic}

@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes breathe{0%,100%{opacity:.18}50%{opacity:.45}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes fade{to{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes look{0%,40%,100%{transform:translateX(0)}55%,85%{transform:translateX(2.5px)}}
@keyframes glowdot{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes scan{from{transform:translate(-3px,-2px)}to{transform:translate(3px,2px)}}
@keyframes scribble{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes blinkop{50%{opacity:.35}}
@keyframes flip{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.55)}}
@keyframes flash{0%{stroke-width:2}30%{stroke-width:7;fill:color-mix(in srgb,var(--accent) 30%,var(--panel3))}100%{stroke-width:2}}
@keyframes floatz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(10px,-22px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}15%{transform:rotate(-16deg)}30%{transform:rotate(14deg)}45%{transform:rotate(-8deg)}60%{transform:rotate(4deg)}}
@keyframes bump{50%{transform:scale(1.18)}}
@keyframes barpulse{50%{opacity:.6}}
@keyframes toastin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.particle{display:none}.toast{animation:none}}

@media (max-width:1100px){.main{grid-template-columns:232px minmax(0,1fr)}.inspector{grid-column:1/-1;max-height:280px}}
@media (max-width:760px){
  body{overflow:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .sessions{max-height:280px}
  .center{grid-template-rows:360px 220px}
  .inspector{max-height:360px}
  .stats{margin-left:0}
  .stat{min-width:0;flex:1}
  .brand .sub{display:none}
  .glegend{display:none}
}
</style>

<script>
(() => {
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.random()*(b-a);

const now = () => performance.now();

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- sample data (example rows, not real sessions) ---------- */
const files = ['src/daemon/tailer.ts','src/daemon/sessions.ts','src/parse/jsonl.ts','src/ui/Graph.tsx','src/ui/Timeline.tsx','src-tauri/src/watch.rs','package.json','src/parse/events.ts','README.md','src/ui/Inspector.tsx'];

const urls = ['code.claude.com/docs/en/hooks','code.claude.com/docs/en/sub-agents','tauri.app/v2/guides'];
const thoughts = ['Transcript writes tool_use before execution → start time derivable without hooks.','Slot allocation must be stable across re-renders.','Need byte-offset tail; re-reading whole file kills large sessions.','Coalesce FSEvents at 16 ms before parsing.'];
const TOOLS = {
  Read:{cls:'t-read',ic:'ic-file',arg:()=>pick(files)},
  Grep:{cls:'t-grep',ic:'ic-search',arg:()=>'/'+pick(patterns)+'/ src'},
  Glob:{cls:'t-glob',ic:'ic-search',arg:()=>'**/*.'+pick(['ts','rs','tsx'])},
  Edit:{cls:'t-edit',ic:'ic-pencil',arg:()=>pick(files)},
  Write:{cls:'t-write',ic:'ic-pencil',arg:()=>pick(files)},
  Bash:{cls:'t-bash',ic:'ic-term',arg:()=>pick(cmds)},
  WebFetch:{cls:'t-web',ic:'ic-globe',arg:()=>pick(urls)},
  think:{cls:'t-think',ic:'ic-think'},
  Agent:{cls:'t-agent',ic:'ic-spark'},
};
const AGENT_TYPES = [
  {type:'Explore', color:'var(--ty-explore)', descs:['Map transcript parser','Find all SessionStore uses','Locate subagent jsonl writer'], tools:['Grep','Glob','Read','Read','Grep','Read'], model:'haiku'},
  {type:'Plan', color:'var(--ty-plan)', descs:['Plan tail-follow strategy','Design event reducer'], tools:['Read','Grep','Read','Read','WebFetch','Read'], model:'opus'},
  {type:'general-purpose', color:'var(--ty-gp)', descs:['Wire WebSocket broadcaster','Add jsonl offset tailer','Implement slot layout'], tools:['Read','Grep','Edit','Edit','Bash','Read','Edit','Bash'], model:'sonnet'},
  {type:'code-reviewer', color:'var(--ty-review)', descs:['Review daemon diff','Audit watch.rs for leaks'], tools:['Bash','Read','Read','Grep','Read'], model:'opus'},
];
const SESSIONS = [
  {id:'52fd573f-edf4-4848-ab31-1f3c670fb3d6', title:'Claude code sessions GUI app', cwd:'~/baseerah/claude-code-gui', branch:'main', model:'opus', status:'busy', kind:'vscode', started: now()-14*60000},
  {id:'a1c9e7d2-4b8f-4e21-9d3a-7f2e5c1b8a44', title:'Fix OCR pipeline retries', cwd:'~/Downloads/rihal-ocr', branch:'fix/retry-backoff', model:'sonnet', status:'wait', kind:'terminal', started: now()-42*60000, waiting:'Bash · bun run migrate', calls:[['Read','src/ocr/retry.ts',640],['Grep','/backoff/ src',380],['Edit','src/ocr/retry.ts',910],['Bash','bun test retry',2400]]},
  {id:'7e3b2f90-1c5d-4a6e-8b2f-3d9c4e5a6b77', title:'Keycloak realm migration', cwd:'~/odp/mueen-keycloak-v2', branch:'main', model:'opus', status:'idle', kind:'terminal', started: now()-96*60000, idleFor:'12 min', calls:[['Edit','realm-export.json',1200],['Bash','docker compose up -d',5400],['Read','README.md',300]]},
  {id:'job-3f8a', title:'Portfolio lighthouse pass', cwd:'~/baseerah/portfolio', branch:'perf/lh', model:'sonnet', status:'done', kind:'background', started: now()-180*60000, calls:[['Bash','npx lighthouse http://localhost:3000',18200],['Edit','next.config.js',700],['Edit','app/layout.tsx',820],['Bash','npm run build',24000]]},
];
SESSIONS.forEach(s => s.spark = Array.from({length:22}, () => s.status==='busy'? rnd(.2,1) : s.status==='wait'? rnd(.05,.3) : rnd(0,.12)));

/* ---------- state ---------- */
const state = { agents:[], calls:[], tokens:0, selected:'main', session:0 };
const main = {id:'main', type:'main', desc:'opus · interactive', color:'var(--accent)', model:'opus', start: SESSIONS[0].started, done:false, cur:null, tools:[], tokens:0, isMain:true};
state.agents.push(main);
const SLOTS = [-90,-30,30,90,150,210].map(d => { const r=d*Math.PI/180; return {x:400+Math.cos(r)*205, y:222+Math.sin(r)*150, used:false}; });

/* ---------- toasts ---------- */
function toast(color, icon, title, msg){
  if (reduced) return;
  const t = document.createElement('div'); t.className='toast'; t.style.setProperty('--c', color);
  t.innerHTML = `<span class="ic"><svg><use href="#${icon}"/></svg></span><b>${title}</b><span class="m">${msg}</span>`;
  const box = $('#toasts'); box.appendChild(t); if (box.children.length>4) box.firstChild.remove();
  setTimeout(()=>t.remove(), 3900);
}
function bump(sel, val){ const e=$(sel); if (e.textContent!==String(val)){ e.textContent=val; e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); } }

/* ---------- sessions rail ---------- */
const avatar = (s) => `<svg class="av" viewBox="-24 -34 48 56"><g class="node ${s.status==='busy'?'live':s.status==='idle'?'zz':s.status==='done'?'done':''}"><use href="#bot" x="-24" y="-34" width="48" height="56"/></g></svg>`;
function renderSessions(){
  const ul = $('#sessions'); ul.innerHTML='';

    const li = document.createElement('li');
    li.className = 'sess '+s.status+(i===state.session?' sel':'');
    const pill = s.status==='busy'?'<span class="pill busy"><i></i>busy</span>': s.status==='wait'?'<span class="pill wait"><i></i>waiting</span>': s.status==='idle'?'<span class="pill"><i></i>idle</span>':'<span class="pill done"><i></i>done</span>';
    li.innerHTML = `<div class="row">${avatar(s)}<span class="title">${s.title}</span>${pill}</div>
      <div class="cwd">${s.cwd} · ${s.branch}</div>
      <div class="row"><div class="spark">${s.spark.map(v=>`<span style="height:${Math.max(8,v*100)}%"></span>`).join('')}</div></div>
      <div class="meta"><span class="kind">${s.kind}</span><span><b>${s.model}</b></span><span class="el">${fmtDur(now()-s.started)}</span>${i===0?'<span><b class="agc">0</b> agents</span>':''}${s.waiting?`<span class="waitmsg"><svg><use href="#ic-bell"/></svg>${s.waiting}</span>`:''}${s.idleFor?`<span>idle ${s.idleFor}</span>`:''}</div>`;
    li.addEventListener('click', () => selectSession(i));
    ul.appendChild(li);
  });
}
renderSessions();
setInterval(() => {
  SESSIONS.forEach((s,i) => {
    s.spark.shift(); s.spark.push(s.status==='busy'? rnd(.2,1) : s.status==='wait'? rnd(.05,.3) : rnd(0,.12));
    const li = $('#sessions').children[i];
    [...li.querySelectorAll('.spark span')].forEach((el,j) => el.style.height = Math.max(8,s.spark[j]*100)+'%');
    li.querySelector('.el').textContent = fmtDur(now()-s.started);
  });
  const agc = $('.agc'); if (agc) agc.textContent = state.agents.filter(a=>!a.isMain && !a.done).length;
}, 1500);

/* ---------- graph ---------- */
const svg = $('#graph');
const NS = 'http://www.w3.org/2000/svg';
const el = (t, attrs={}, parent) => { const e = document.createElementNS(NS,t); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const gEdges = el('g',{id:'edges'},svg), gNodes = el('g',{id:'nodes'},svg), gScene = el('g',{id:'scene', class:'scene'},svg);
const R = 34, CIRC = 2*Math.PI*R;

function nodeFor(a){
  const x = a.isMain? 400 : a.slot.x, y = a.isMain? 222 : a.slot.y;
  const g = el('g',{class:'node enter'+(a.isMain?' root':''), transform:`translate(${x},${y})`}, gNodes);
  g.style.transformOrigin = `${x}px ${y}px`; g.style.transformBox = 'view-box';
  const rb = a.isMain? 42 : R;
  el('circle',{class:'halo', r: rb+10}, g);
  el('circle',{class:'base', r: rb}, g);
  if (!a.isMain) el('circle',{class:'ring', r:R, 'stroke-dasharray':CIRC, 'stroke-dashoffset':CIRC, stroke:a.color}, g);
  const sc = a.isMain? 1.15 : 1;
  const bot = el('use',{href:'#bot', x:-24*sc, y:-34*sc+4, width:48*sc, height:56*sc}, g);
  bot.style.setProperty('animation-delay', (Math.random()*3).toFixed(2)+'s');
  // accessory badge
  const acc = el('g',{class:'acc', transform:`translate(${rb-3},${-rb+11})`}, g);
  el('circle',{class:'abg', r:12.5}, acc);
  const accUse = el('use',{href:'#ic-spark', x:-7, y:-7, width:14, height:14}, acc);
  const ly = rb+22;
  const lbl = el('text',{class:'lbl', y:ly}, g); lbl.textContent = a.isMain? 'main thread' : a.type;
  const desc = el('text',{class:'desc', y:ly+15}, g); desc.textContent = a.isMain? SESSIONS[0].title : a.desc;
  const chipbg = el('rect',{class:'chipbg', x:-30, y:-rb-22, width:60, height:16, fill:a.color}, g);
  const chip = el('text',{class:'chip', y:-rb-10.5}, g);
  const title = el('title',{}, g); title.textContent = a.isMain? 'Main thread' : `${a.type} · ${a.desc}`;
  g.addEventListener('click', () => select(a.id));
  a.el = {g, acc, accUse, chip, chipbg, ring: g.querySelector('.ring')};
  setTimeout(()=>g.classList.remove('enter'), 600);
  if (!a.isMain && !reduced){
    const b = el('circle',{class:'burst', cx:x, cy:y, r:20, stroke:a.color}, gNodes);
    el('animate',{attributeName:'r', from:20, to:70, dur:'.7s', fill:'freeze'}, b);
    el('animate',{attributeName:'opacity', from:1, to:0, dur:'.7s', fill:'freeze'}, b);
    setTimeout(()=>b.remove(), 750);
  }
  updateNode(a);
  return g;
}
function updateNode(a){
  const {g, acc, accUse, chip, chipbg, ring} = a.el;
  g.classList.toggle('live', !a.done && !!a.cur);
  g.classList.toggle('done', a.done);
  g.classList.toggle('sel', state.selected===a.id);
  let ic = 'ic-spark', txt = a.done? 'done' : a.cur? (a.cur.tool==='think'?'thinking':a.cur.tool) : 'thinking';
  if (a.done) ic='ic-check'; else if (a.cur) ic = TOOLS[a.cur.tool].ic;
  accUse.setAttribute('href','#'+ic);
  acc.setAttribute('class', 'acc '+(a.done? 't-read' : a.cur? TOOLS[a.cur.tool].cls : 't-think'));
  acc.style.opacity = (a.isMain && !a.cur)? 0 : 1;
  chip.textContent = txt;
  const w = txt.length*6.6+14; chipbg.setAttribute('width', w); chipbg.setAttribute('x', -w/2);
  chipbg.style.display = chip.style.display = (a.isMain && !a.cur)? 'none':'';
  if (ring){ const p = a.done? 1 : Math.min(1, (now()-a.start)/a.est); ring.setAttribute('stroke-dashoffset', CIRC*(1-p)); }
}
function edgeFor(a){
  const p0 = {x:400,y:222}, p1 = a.slot;
  const dx=p1.x-p0.x, dy=p1.y-p0.y, L=Math.hypot(dx,dy);
  const ux=dx/L, uy=dy/L, mx=(p0.x+p1.x)/2 - uy*28, my=(p0.y+p1.y)/2 + ux*28;
  const s = {x:p0.x+ux*44, y:p0.y+uy*44}, e = {x:p1.x-ux*37, y:p1.y-uy*37};
  const d = `M${s.x},${s.y} Q${mx},${my} ${e.x},${e.y}`;
  const id = 'edge-'+a.id;
  const path = el('path',{id, class:'edge live', d}, gEdges);
  const p = el('circle',{class:'particle', r:3.2}, gEdges);
  const am = el('animateMotion',{dur:'1.4s', repeatCount:'indefinite'}, p);
  el('mpath',{href:'#'+id}, am);
  a.edge = {path, p};
}
nodeFor(main);

/* other-session scenes */
function scene(s){
  gScene.innerHTML='';
  const g = el('g',{class:'node '+(s.status==='wait'?'':s.status==='idle'?'zz':'done'), transform:'translate(400,200)'}, gScene);
  el('circle',{class:'base', r:46, stroke: s.status==='wait'? 'var(--wait)': s.status==='done'?'var(--active)':'var(--faint)'}, g);
  el('use',{href:'#bot', x:-28, y:-36, width:56, height:64}, g);
  if (s.status==='wait'){
    const q = el('text',{class:'qmark', x:44, y:-30}, g); q.textContent='?';
    const bell = el('g',{class:'bell', transform:'translate(-58,-36)'}, g);
    el('use',{href:'#ic-bell', width:22, height:22, x:-11, y:-11, stroke:'var(--wait)', fill:'none','stroke-width':2}, bell);
  }
  if (s.status==='idle'){ ['z','z','z'].forEach((z,i)=>{ const t=el('text',{class:'zzz'+(i?' z'+(i+1):''), x:40, y:-28}, g); t.textContent=z; }); }
  if (s.status==='done'){ const c=el('g',{class:'acc t-read', transform:'translate(34,-32)'},g); el('circle',{class:'abg',r:12},c); el('use',{href:'#ic-check',x:-7,y:-7,width:14,height:14},c); }
  const lbl = el('text',{class:'lbl', y:72, x:0}, g); lbl.textContent = s.title;
  const msg = s.status==='wait'? `Waiting for your permission · ${s.waiting}` : s.status==='idle'? `Idle for ${s.idleFor} · last: ${s.calls.at(-1)[0]} ${s.calls.at(-1)[1]}` : `Background job finished · ${s.calls.length} tool calls`;
  const w = msg.length*6.4+24;
  el('rect',{class:'msgbg', x:-w/2, y:84, width:w, height:26}, g);
  const m = el('text',{class:'msg', y:101}, g); m.textContent = msg;
}

/* ---------- timeline ---------- */
const lanes = $('#lanes'), WIN = 60000;
function laneFor(a){
  const l = document.createElement('div'); l.className='lane';
  l.innerHTML = `<div class="ln"><i style="background:${a.color}"></i>${a.isMain?'main':a.type}</div><div class="track"></div>`;
  lanes.insertBefore(l, $('#ticks'));
  a.lane = l; a.track = l.querySelector('.track');
}
laneFor(main);
(function ticks(){ const t=$('#ticks'); for (let s=60;s>=0;s-=10){ const sp=document.createElement('span'); sp.style.left=(100-s/60*100)+'%'; sp.textContent = s===0?'now':'-'+s+'s'; t.appendChild(sp);} })();

/* ---------- inspector ---------- */
function select(id){ state.selected=id; state.agents.forEach(updateNode); renderInspector(true); }
function selectSession(i){
  state.session = i; renderSessions();
  const sim = i===0;
  gNodes.style.display = gEdges.style.display = sim? '' : 'none';
  gScene.style.display = sim? 'none' : '';
  $('#tl-empty').hidden = sim; [...lanes.querySelectorAll('.lane')].forEach(l => l.style.display = sim? '' : 'none');
  $('.playhead').style.display = sim? '' : 'none';
  if (!sim){
    const s = SESSIONS[i]; scene(s);
    $('#tl-empty').textContent = s.status==='wait'? 'paused · waiting on permission' : s.status==='idle'? 'no activity in last 60 s' : 'job ended · open history to replay';
    $('#g-hint').textContent = s.id;
    renderStaticInspector(s);
  } else { $('#g-hint').textContent=''; renderInspector(true); }
}
function renderStaticInspector(s){
  $('#i-hint').textContent = s.kind==='background'? 'jobs/'+s.id : 'session';
  const col = s.status==='wait'?'var(--wait)':s.status==='done'?'var(--active)':'var(--faint)';
  $('#ihead').innerHTML = `<div class="who"><span class="tybadge" style="background:${col}">${s.status}</span><span class="type">${s.title}</span></div>
    <div class="id">${s.id}</div>
    <div class="kv"><div><span class="k">Model</span><div class="v">${s.model}</div></div><div><span class="k">Elapsed</span><div class="v">${fmtDur(now()-s.started)}</div></div><div><span class="k">Tools</span><div class="v">${s.calls.length}</div></div><div><span class="k">Tokens</span><div class="v">${(41_200+s.calls.length*3170).toLocaleString()}</div></div></div>`;
  $('#inow').innerHTML = s.status==='wait'? `<span class="k">Needs you</span><div class="v"><span style="color:var(--wait)">⏸</span><span class="txt">${s.waiting}</span></div>`
    : s.status==='idle'? `<span class="k">Status</span><div class="v"><span class="txt" style="color:var(--muted)">idle · waiting for next prompt</span></div>`
    : `<span class="k">Status</span><div class="v"><span style="color:var(--active)">✓ completed</span><span class="txt" style="color:var(--muted)">exit 0 · summary ready</span></div>`;
  const f = $('#feed'); f.innerHTML='';
  [...s.calls].reverse().forEach(([tool,arg,ms]) => f.appendChild(feedItem({tool,arg,start:0,end:ms})));
}
function renderInspector(full){
  if (state.session!==0) return;
  const a = state.agents.find(x=>x.id===state.selected) || main;
  $('#i-hint').textContent = a.isMain? 'main thread' : a.id;
  if (full){
    $('#ihead').innerHTML = `<div class="who"><span class="tybadge" style="background:${a.color}">${a.isMain?'session':a.type}</span><span class="type">${a.isMain? SESSIONS[0].title : a.desc}</span></div>
      <div class="id">${a.isMain? SESSIONS[0].id : 'subagents/'+a.id+'.jsonl'}</div>
      <div class="kv"><div><span class="k">Model</span><div class="v">${a.model}</div></div><div><span class="k">Elapsed</span><div class="v el"></div></div><div><span class="k">Tools</span><div class="v tc"></div></div><div><span class="k">Tokens</span><div class="v tk"></div></div></div>`;
    $('#feed').innerHTML = '';
    a.tools.slice(-14).reverse().forEach(c => $('#feed').appendChild(feedItem(c)));
  }
  $('#ihead .el').textContent = fmtDur((a.done? a.end : now()) - a.start);
  $('#ihead .tc').textContent = a.tools.filter(c=>c.tool!=='think').length;
  $('#ihead .tk').textContent = a.tokens.toLocaleString();
  const nowEl = $('#inow');
  if (a.done) nowEl.innerHTML = `<span class="k">Status</span><div class="v"><span style="color:var(--active)">✓ completed</span><span class="txt" style="color:var(--muted)">returned result to main thread</span></div>`;
  else if (a.cur && a.cur.tool!=='think') nowEl.innerHTML = `<span class="k">Now running</span><div class="v"><span class="spin"></span><b>${a.cur.tool}</b><span class="txt">${a.cur.arg}</span><span style="color:var(--active)">${fmtMs(now()-a.cur.start)}</span></div>`;
  else nowEl.innerHTML = `<span class="k">Now</span><div class="v"><span class="spin"></span><span class="txt" style="color:var(--muted)">thinking…</span></div>`;
}
function feedItem(c){
  const li = document.createElement('li');
  const t = TOOLS[c.tool];
  const dur = c.tool==='Agent'? 'spawned' : c.end? fmtMs(c.end-c.start) : '…';
  if (c.tool==='think'){ li.className='fi'+(c.end?'':' running'); li.innerHTML = `<span class="ic t-think"><svg><use href="#ic-think"/></svg></span><span class="tn">Assistant</span><span class="ta">reasoning</span><span class="td">${dur}</span><div class="thought">${c.arg}</div>`; c.li=li; return li; }
  li.className = 'fi'+(c.end?'':' running')+(c.tool==='Agent'?' agent':'');
  li.innerHTML = `<span class="ic ${t.cls}"><svg><use href="#${t.ic}"/></svg></span><span class="tn">${c.tool}</span><span class="ta" title="${c.arg}">${c.arg}</span><span class="td">${dur}</span>`;
  c.li = li; return li;
}

/* ---------- simulation ---------- */
function startCall(a, tool, arg, dur){
  const c = {tool, arg, start: now(), dur, end:null, agent:a};
  a.cur = c; a.tools.push(c); state.calls.push(c);
  const bar = document.createElement('div'); bar.className = 'bar running '+TOOLS[tool].cls; bar.title = `${tool} ${arg||''}`; a.track.appendChild(bar); c.bar = bar;
  if (state.selected===a.id && state.session===0){ const f=$('#feed'); f.insertBefore(feedItem(c), f.firstChild); if (f.children.length>16) f.lastChild.remove(); }
  if (tool==='Edit' || tool==='Write') toast('var(--t-edit)','ic-pencil', (a.isMain?'main':a.type)+' edits', arg);
  if (tool==='Bash' && !a.isMain) toast('var(--t-bash)','ic-term', a.type+' runs', arg);
  updateNode(a); renderInspector(false);
}
function endCall(a){
  const c = a.cur; if (!c) return; c.end = now(); a.cur = null;
  c.bar.classList.remove('running'); c.bar.title += ' · '+fmtMs(c.end-c.start);
  if (c.li){ c.li.classList.remove('running'); c.li.querySelector('.td').textContent = fmtMs(c.end-c.start); }
  const tk = Math.round(rnd(120, 900)); a.tokens += tk; state.tokens += tk;
  updateNode(a);
}
function spawnAgent(){
  const slot = SLOTS.find(s=>!s.used); if (!slot) return;
  const def = pick(AGENT_TYPES);
  const a = {id:'agent-'+(Math.random().toString(16).slice(2,10)), type:def.type, desc:pick(def.descs), color:def.color, model:def.model, start:now(), done:false, cur:null, tools:[], tokens:0, plan:[...def.tools].sort(()=>Math.random()-.5).slice(0, 4+Math.floor(rnd(0,4))), step:0, slot};
  a.est = a.plan.length*1900; slot.used = true;
  state.agents.push(a); edgeFor(a); nodeFor(a); laneFor(a);
  startCall(main, 'Agent', `${def.type} · ${a.desc}`, 0); endCall(main);
  main.el.g.classList.remove('flash'); void main.el.g.getBBox(); main.el.g.classList.add('flash');
  startCall(a, 'think', pick(thoughts), rnd(500,1100));
  $('#g-hint').textContent = `spawned ${a.id}`;
  toast(a.color,'ic-spark','Agent spawned', `${def.type} · ${a.desc}`);
}
function finishAgent(a){
  a.done = true; a.end = now(); a.cur = null; updateNode(a);
  a.edge.path.classList.remove('live'); a.edge.path.classList.add('done'); a.edge.p.remove();
  a.lane.classList.add('gone');
  if (state.selected===a.id) renderInspector(false);
  $('#g-hint').textContent = `${a.id} completed · result returned`;
  toast('var(--accent)','ic-flag','Result returned', `${a.type} · ${a.tools.filter(c=>c.tool!=='think').length} tools · ${fmtDur(a.end-a.start)}`);
  if (!reduced){
    const p = el('circle',{class:'particle back', r:4.5}, gEdges);
    const am = el('animateMotion',{dur:'.9s', keyPoints:'1;0', keyTimes:'0;1', calcMode:'linear', fill:'freeze'}, p);
    el('mpath',{href:'#edge-'+a.id}, am);
    setTimeout(() => { p.remove(); main.el.g.classList.remove('flash'); void main.el.g.getBBox(); main.el.g.classList.add('flash'); }, 900);
  }
  setTimeout(() => {
    a.el.g.classList.add('leave'); a.edge.path.style.transition='opacity .6s'; a.edge.path.style.opacity=0;
    setTimeout(() => { a.el.g.remove(); a.edge.path.remove(); a.slot.used=false; }, 650);
  }, 7000);
}
function stepAgent(a){
  if (a.cur){ if (now()-a.cur.start >= a.cur.dur) endCall(a); else return; }
  else if (a.gapUntil && now() < a.gapUntil) return;
  if (!a.cur && a.gapUntil === undefined){ a.gapUntil = now()+rnd(120,420); return; }
  a.gapUntil = undefined;
  if (a.isMain){
    const running = state.agents.filter(x=>!x.isMain && !x.done).length;
    if (running < 3 && Math.random() < 0.28){ spawnAgent(); a.gapUntil = now()+rnd(600,1400); return; }
    if (Math.random() < 0.22) startCall(a, 'think', pick(thoughts), rnd(700,1600));
    else { const t = pick(['Read','Grep','Edit','Bash','Read','Glob']); startCall(a, t, TOOLS[t].arg(), rnd(300,1800)); }
    return;
  }
  if (a.step >= a.plan.length){ finishAgent(a); return; }
  const t = a.plan[a.step++];
  startCall(a, t, TOOLS[t].arg(), t==='Bash'? rnd(600,2600) : rnd(250,1500));
}
setInterval(() => { state.agents.forEach(a => { if (!a.done) stepAgent(a); }); }, 90);

/* ---------- frame loop ---------- */
let lastText = 0;
function frame(){
  const t = now();
  const w0 = t - WIN;
  state.calls = state.calls.filter(c => { const e = c.end ?? t; if (e < w0){ c.bar.remove(); return false; }
    const l = Math.max(0,(c.start-w0)/WIN*100), r = (e-w0)/WIN*100; c.bar.style.left=l+'%'; c.bar.style.width=Math.max(.3,r-l)+'%'; return true; });
  state.agents.forEach(a => { if (!a.done && a.el.ring) updateNode(a); });
  if (t - lastText > 250){
    lastText = t;
    const running = state.agents.filter(a=>!a.isMain && !a.done).length;
    bump('#s-agents', running); $('#s-agents').classList.toggle('live', running>0);
    bump('#s-tpm', state.calls.filter(c=>c.tool!=='think' && c.start > t-60000).length);
    $('#s-tok').textContent = (184_320 + state.tokens).toLocaleString();
    renderInspector(false);
  }
  requestAnimationFrame(frame);
}
selectSession(0);
requestAnimationFrame(frame);
})();
</script>
