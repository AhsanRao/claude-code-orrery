[workspace]
resolver = "2"
members = ["crates/orrery-core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AhsanRao/claude-code-orrery"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify = "8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Proc-macros and build scripts are host-side and must keep their symbols;
# stripping them breaks `can't find crate for *_derive` on macOS.
[profile.release.build-override]
strip = false
opt-level = 0
